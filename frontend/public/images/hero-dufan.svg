<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Ilustrasi suasana senja taman rekreasi dengan bianglala, lintasan roller coaster, dan gerbang utama">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08142C"/>
      <stop offset="55%" stop-color="#0B1B3B"/>
      <stop offset="100%" stop-color="#1A356E"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="72%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F2B705" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#F2B705" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1B3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10254F"/>
      <stop offset="100%" stop-color="#071024"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>
  <rect width="1200" height="720" fill="url(#glowGold)"/>

  <!-- Subtle stars -->
  <g fill="#F8FAFC" opacity="0.65">
    <circle cx="150" cy="110" r="2"/>
    <circle cx="290" cy="70" r="1.5"/>
    <circle cx="440" cy="135" r="2"/>
    <circle cx="620" cy="80" r="1.5"/>
    <circle cx="960" cy="95" r="2"/>
    <circle cx="1080" cy="150" r="2.2"/>
    <circle cx="810" cy="60" r="1.5"/>
    <circle cx="520" cy="52" r="1.5"/>
  </g>

  <!-- Crescent moon -->
  <circle cx="1015" cy="130" r="34" fill="#F2B705" opacity="0.9"/>
  <circle cx="1030" cy="122" r="30" fill="#10224A"/>

  <!-- Distant roller coaster loop & hills -->
  <path d="M-20 500 Q 130 330 270 430 T 560 390 T 860 440 T 1220 380" fill="none" stroke="#274787" stroke-width="5"/>
  <path d="M-20 515 Q 130 345 270 445 T 560 405 T 860 455 T 1220 395" fill="none" stroke="#1E3A70" stroke-width="3"/>
  <g stroke="#22407A" stroke-width="3" opacity="0.8">
    <line x1="120" y1="400" x2="120" y2="570"/>
    <line x1="190" y1="392" x2="190" y2="570"/>
    <line x1="270" y1="435" x2="270" y2="570"/>
    <line x1="390" y1="422" x2="390" y2="570"/>
    <line x1="500" y1="396" x2="500" y2="570"/>
    <line x1="620" y1="418" x2="620" y2="570"/>
  </g>

  <!-- Rollercoaster Golden Loop Accent -->
  <circle cx="470" cy="365" r="76" fill="none" stroke="#F2B705" stroke-width="6" opacity="0.85"/>
  <circle cx="470" cy="365" r="64" fill="none" stroke="#3B5FA6" stroke-width="2.5"/>

  <!-- Grand Ferris Wheel (Bianglala) -->
  <g transform="translate(830, 340)">
    <!-- Support legs -->
    <line x1="-115" y1="225" x2="0" y2="0" stroke="#3B5FA6" stroke-width="10" stroke-linecap="round"/>
    <line x1="115" y1="225" x2="0" y2="0" stroke="#3B5FA6" stroke-width="10" stroke-linecap="round"/>
    <line x1="-80" y1="155" x2="80" y2="155" stroke="#2D4D8C" stroke-width="6"/>
    <!-- Wheel rings -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="#E2E8F0" stroke-width="5" opacity="0.9"/>
    <circle cx="0" cy="0" r="158" fill="none" stroke="#F2B705" stroke-width="3.5" opacity="0.95"/>
    <circle cx="0" cy="0" r="46" fill="#0B1B3B" stroke="#F2B705" stroke-width="4"/>
    <!-- Spokes -->
    <g stroke="#93C5FD" stroke-width="2" opacity="0.45">
      <line x1="0" y1="-185" x2="0" y2="185"/>
      <line x1="-185" y1="0" x2="185" y2="0"/>
      <line x1="-131" y1="-131" x2="131" y2="131"/>
      <line x1="-131" y1="131" x2="131" y2="-131"/>
      <line x1="-71" y1="-171" x2="71" y2="171"/>
      <line x1="-171" y1="-71" x2="171" y2="71"/>
      <line x1="-171" y1="71" x2="171" y2="-71"/>
      <line x1="-71" y1="171" x2="71" y2="-171"/>
    </g>
    <!-- Gondolas -->
    <g fill="#F2B705">
      <rect x="-10" y="-196" width="20" height="14" rx="4"/>
      <rect x="-10" y="182" width="20" height="14" rx="4"/>
      <rect x="-196" y="-7" width="20" height="14" rx="4"/>
      <rect x="176" y="-7" width="20" height="14" rx="4"/>
      <rect x="120" y="-140" width="20" height="14" rx="4"/>
      <rect x="-140" y="-140" width="20" height="14" rx="4"/>
      <rect x="120" y="124" width="20" height="14" rx="4"/>
      <rect x="-140" y="124" width="20" height="14" rx="4"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#F2B705"/>
  </g>

  <!-- Fantasy Castle / Arch Pavilions Silhouette -->
  <g fill="#0F234A" stroke="#2D4D8C" stroke-width="2">
    <rect x="570" y="455" width="170" height="115" rx="6"/>
    <path d="M620 570 L620 515 A35 35 0 0 1 690 515 L690 570 Z" fill="#F2B705" opacity="0.22"/>
    <polygon points="570,455 605,390 640,455" fill="#162A5A"/>
    <polygon points="625,455 655,365 685,455" fill="#1E3A70"/>
    <polygon points="670,455 705,390 740,455" fill="#162A5A"/>
    <rect x="652" y="340" width="6" height="25" fill="#F2B705"/>
  </g>

  <!-- Waterfront Promenade -->
  <rect x="0" y="560" width="1200" height="160" fill="url(#water)"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#F2B705" stroke-width="3" opacity="0.65"/>

  <!-- Water light reflections -->
  <g fill="#F2B705" opacity="0.22">
    <rect x="760" y="585" width="140" height="4" rx="2"/>
    <rect x="785" y="605" width="90" height="3" rx="1.5"/>
    <rect x="420" y="592" width="100" height="3" rx="1.5"/>
    <rect x="610" y="618" width="80" height="3" rx="1.5"/>
  </g>
</svg>
