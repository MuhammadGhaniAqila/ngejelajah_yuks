databases:
  - name: jelajahin-db
    databaseName: jelajahin_website
    user: jelajahin
    plan: free

services:
  - type: web
    name: jelajahin-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Jelajahin
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: AUTO_SEED
        value: auto
      - key: DATABASE_URL
        fromDatabase:
          name: jelajahin-db
          property: connectionString
